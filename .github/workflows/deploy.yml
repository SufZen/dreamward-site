name: Deploy

# Builds the site and publishes it to GitHub Pages. Runs on every push, on
# demand, and hourly: the hourly run rebuilds only when a new Dreamward release
# is out (so the download buttons follow it without any cross-repo token).
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

env:
  # Set the repository variables SITE_URL and SITE_BASE at the domain cutover:
  #   SITE_URL=https://dreamward.life  SITE_BASE=/
  SITE_URL: ${{ vars.SITE_URL || 'https://sufzen.github.io/dreamward-site' }}
  SITE_BASE: ${{ vars.SITE_BASE || '/dreamward-site' }}

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.decide.outputs.skip }}
    steps:
      - name: New release since the last deploy?
        id: decide
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          latest=$(gh api repos/SufZen/Dreamward/releases/latest --jq .tag_name)
          deployed=$(curl -fsS "${SITE_URL%/}/version.txt" 2>/dev/null | tr -d '[:space:]' || true)
          echo "latest=$latest deployed=${deployed:-none}"
          [ "$latest" = "$deployed" ] && echo "skip=true" >> "$GITHUB_OUTPUT" || true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.decide.outputs.skip != 'true'
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        if: steps.decide.outputs.skip != 'true'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: steps.decide.outputs.skip != 'true'
        with:
          node-version: 22
          cache: pnpm
      - if: steps.decide.outputs.skip != 'true'
        run: pnpm install --frozen-lockfile
      - name: Build
        if: steps.decide.outputs.skip != 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REQUIRE_RELEASE: '1'
          ASTRO_TELEMETRY_DISABLED: '1'
        run: pnpm build
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
        if: steps.decide.outputs.skip != 'true'
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        if: steps.decide.outputs.skip != 'true'
        with:
          path: dist

  deploy:
    needs: build
    if: needs.build.outputs.skip != 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
